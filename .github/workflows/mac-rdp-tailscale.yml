name: macOS RDP (VNC via Tailscale)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Session length in minutes (1-330)'
        required: false
        default: '300'

permissions:
  contents: read

concurrency:
  group: mac-rdp
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # -eo pipefail

jobs:
  mac-rdp:
    runs-on: xcode-27   # macOS 27 "Golden Gate", arm64 only
    timeout-minutes: 360
    env:
      VNC_PORT: '5900'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Validate secrets and inputs
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          MINUTES_IN: ${{ inputs.minutes }}
        run: |
          [ -n "$VNC_PASSWORD" ] || { echo "::error::VNC_PASSWORD secret is not set (Settings -> Secrets and variables -> Actions)"; exit 1; }
          [ -n "$TS_AUTHKEY" ] || { echo "::error::TS_AUTHKEY secret is not set (Tailscale admin console -> Settings -> Keys)"; exit 1; }
          if [ "${#VNC_PASSWORD}" -gt 8 ]; then
            echo "::warning::VNC only uses the first 8 characters of the password"
          fi

          MINUTES="${MINUTES_IN:-300}"
          case "$MINUTES" in ''|*[!0-9]*) MINUTES=300 ;; esac
          [ "$MINUTES" -lt 1 ] && MINUTES=1
          [ "$MINUTES" -gt 330 ] && MINUTES=330
          echo "SESSION_MINUTES=$MINUTES" >> "$GITHUB_ENV"

      - name: Enable Screen Sharing (VNC)
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          KICKSTART=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart

          # Never let the machine or screen sleep
          sudo pmset -a sleep 0 displaysleep 0 disksleep 0 || true
          defaults -currentHost write com.apple.screensaver idleTime 0 || true
          nohup caffeinate -dimsu >/dev/null 2>&1 &

          # NOTE: we deliberately do not touch the 'runner' account's password.
          # It already has a Secure Token, and macOS refuses to change a
          # Secure-Token account's password without another Secure-Token
          # admin's *current* password (eDSAuthFailed otherwise). Creating a
          # brand-new account (next step) has no such requirement.

          # Remote Management + legacy VNC password (the official way)
          sudo "$KICKSTART" -activate -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -privs -all
          sudo "$KICKSTART" -configure -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "$VNC_PASSWORD"

          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sudo "$KICKSTART" -restart -agent

          # Wait until the port is really open
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 "$VNC_PORT" 2>/dev/null; then
              echo "VNC is listening on port $VNC_PORT"
              exit 0
            fi
            sleep 2
          done
          echo "::error::VNC port $VNC_PORT did not open"
          sudo launchctl list | grep -iE 'screensharing|ARD' || true
          exit 1

      - name: Grant screen permissions (TCC)
        run: |
          KICKSTART=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          SYS_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          USR_DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"

          echo "--- console user / display"
          stat -f '%Su' /dev/console || true
          pgrep -lx 'loginwindow|WindowServer' || true
          screencapture -x "$RUNNER_TEMP/test.png" 2>&1 || true
          ls -l "$RUNNER_TEMP/test.png" 2>&1 || true

          grant() {  # $1=service  $2=client  $3=0 (bundle id) or 1 (path)
            for DB in "$SYS_DB" "$USR_DB"; do
              sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags,last_modified) VALUES ('$1','$2',$3,2,4,1,'UNUSED',0,strftime('%s','now'));" \
                || echo "::warning::TCC write failed: $1 / $2 / $DB"
            done
          }

          for SVC in kTCCServiceScreenCapture kTCCServicePostEvent kTCCServiceAccessibility kTCCServiceListenEvent; do
            grant "$SVC" com.apple.screensharing.agent 0
            grant "$SVC" com.apple.RemoteDesktop.agent 0
            grant "$SVC" /System/Library/CoreServices/RemoteManagement/screensharingd.bundle/Contents/MacOS/screensharingd 1
            grant "$SVC" /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/MacOS/ARDAgent 1
          done

          echo "--- TCC rows now"
          sudo sqlite3 "$SYS_DB" "select service,client,auth_value from access where client like '%screensharing%' or client like '%RemoteDesktop%' or client like '%ARDAgent%';" || true

          # Reload permissions and restart the daemons
          sudo killall tccd screensharingd ARDAgent 2>/dev/null || true
          sleep 2
          sudo "$KICKSTART" -restart -agent
          for _ in $(seq 1 15); do
            nc -z 127.0.0.1 "$VNC_PORT" 2>/dev/null && break
            sleep 2
          done
          nc -z 127.0.0.1 "$VNC_PORT" || { echo "::error::VNC port closed after restart"; exit 1; }

      - name: Create login account
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          NEWUSER="ciadmin"

          if dscl . -read "/Users/$NEWUSER" UniqueID >/dev/null 2>&1; then
            echo "'$NEWUSER' already exists, just resetting its password (no secure token on it, so this is allowed)"
            sudo sysadminctl -resetPasswordFor "$NEWUSER" -newPassword "$VNC_PASSWORD" 2>&1
          else
            echo "Creating admin account '$NEWUSER'"
            sudo sysadminctl -addUser "$NEWUSER" -fullName "CI Admin" -password "$VNC_PASSWORD" -admin 2>&1
          fi

          sudo createhomedir -c -u "$NEWUSER" >/dev/null 2>&1 || true

          # Skip the macOS first-login setup screens (Siri, Apple ID, etc.)
          HOME_DIR="/Users/$NEWUSER"
          sudo -u "$NEWUSER" defaults write "$HOME_DIR/Library/Preferences/com.apple.SetupAssistant" DidSeeCloudSetup -bool true 2>/dev/null || true
          sudo -u "$NEWUSER" defaults write "$HOME_DIR/Library/Preferences/com.apple.SetupAssistant" GestureMovieSeen none 2>/dev/null || true
          sudo -u "$NEWUSER" defaults write "$HOME_DIR/Library/Preferences/com.apple.SetupAssistant" LastSeenCloudProductVersion "$(sw_vers -productVersion)" 2>/dev/null || true
          sudo -u "$NEWUSER" defaults write "$HOME_DIR/Library/Preferences/com.apple.SetupAssistant" LastSeenBuddyBuildVersion "$(sw_vers -buildVersion)" 2>/dev/null || true

          # Make sure Screen Sharing explicitly allows this user too
          KICKSTART=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$KICKSTART" -configure -users "$NEWUSER" -access -on -privs -all

          echo "--- verifying login"
          if dscl . -authonly "$NEWUSER" "$VNC_PASSWORD" 2>/dev/null; then
            echo "OK: log in with username '$NEWUSER' and your VNC_PASSWORD secret"
          else
            echo "::error::'$NEWUSER' still doesn't accept the secret password"
          fi

      - name: Install and start Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          retry() { for _ in 1 2 3; do "$@" && return 0; sleep 5; done; return 1; }
          retry brew install tailscale
          sudo brew services start tailscale

          for _ in $(seq 1 15); do
            sudo tailscale status >/dev/null 2>&1 && break
            sleep 2
          done

          HOSTNAME="gh-mac-$(date +%s | tail -c 6)"
          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="$HOSTNAME" \
            --ssh=false \
            --accept-dns=true \
            --timeout=60s

          TS_IP=""
          for _ in $(seq 1 15); do
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            [ -n "$TS_IP" ] && break
            sleep 2
          done
          if [ -z "$TS_IP" ]; then
            echo "::error::Tailscale did not come up. Status:"
            sudo tailscale status || true
            exit 1
          fi

          TS_DNS=$(sudo tailscale status --json 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("Self",{}).get("DNSName","").rstrip("."))' 2>/dev/null || true)

          echo "VNC_ENDPOINT: $TS_IP:$VNC_PORT"
          {
            echo "### VNC endpoint (connect with bVNC / RealVNC Viewer)"
            echo '```'
            echo "Host: $TS_IP"
            [ -n "$TS_DNS" ] && echo "# or host: $TS_DNS"
            echo "Port: $VNC_PORT"
            echo '```'
            echo "Password: your VNC_PASSWORD secret (first 8 chars)"
            echo
            echo "Your phone must have the Tailscale app installed and signed into the same account."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep alive
        run: |
          END=$(( $(date +%s) + SESSION_MINUTES * 60 ))
          NEXT_REPORT=$(( $(date +%s) + 1800 ))
          echo "Session: $SESSION_MINUTES min. Cancel the run to stop it early."

          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 30

            if ! nc -z 127.0.0.1 "$VNC_PORT" 2>/dev/null; then
              echo "::warning::VNC port closed, restarting screen sharing..."
              sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent
            fi

            if ! sudo tailscale status >/dev/null 2>&1; then
              echo "::warning::tailscaled looks down, restarting service..."
              sudo brew services restart tailscale
              sleep 5
            fi

            NOW=$(date +%s)
            if [ "$NOW" -ge "$NEXT_REPORT" ]; then
              TS_IP=$(tailscale ip -4 2>/dev/null || echo "unknown")
              echo "VNC_ENDPOINT: $TS_IP:$VNC_PORT  (~$(( (END - NOW) / 60 )) min left)"
              NEXT_REPORT=$(( NOW + 1800 ))
            fi
          done

          echo "Session finished."
