name: macOS RustDesk

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Session length in minutes (1-330)'
        required: false
        default: '300'

permissions:
  contents: read

concurrency:
  group: mac-rustdesk
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  mac-rustdesk:
    runs-on: xcode-27   # macOS 27, arm64 only
    timeout-minutes: 360
    steps:
      - name: Validate secrets and inputs
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          MINUTES_IN: ${{ inputs.minutes }}
        run: |
          [ -n "$VNC_PASSWORD" ] || { echo "::error::VNC_PASSWORD secret is not set"; exit 1; }
          MINUTES="${MINUTES_IN:-300}"
          case "$MINUTES" in ''|*[!0-9]*) MINUTES=300 ;; esac
          [ "$MINUTES" -lt 1 ] && MINUTES=1
          [ "$MINUTES" -gt 330 ] && MINUTES=330
          echo "SESSION_MINUTES=$MINUTES" >> "$GITHUB_ENV"

      - name: Keep system awake
        run: |
          sudo pmset -a sleep 0 displaysleep 0 disksleep 0 || true
          nohup caffeinate -dimsu >/dev/null 2>&1 &

      - name: Download and install RustDesk
        run: |
          API="https://api.github.com/repos/rustdesk/rustdesk/releases/latest"
          URL=$(curl -fsSL "$API" | python3 -c '
          import sys, json
          d = json.load(sys.stdin)
          for a in d["assets"]:
              if a["name"].endswith("-aarch64.dmg"):
                  print(a["browser_download_url"]); break
          ')
          [ -n "$URL" ] || { echo "::error::could not find an aarch64 .dmg in the latest RustDesk release"; exit 1; }
          echo "Downloading $URL"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o "$RUNNER_TEMP/rustdesk.dmg" "$URL"

          MOUNT_OUT=$(hdiutil attach "$RUNNER_TEMP/rustdesk.dmg" -nobrowse -quiet)
          MOUNT=$(echo "$MOUNT_OUT" | grep -Eo '/Volumes/.*$' | tail -1)
          [ -n "$MOUNT" ] || { echo "::error::could not mount the RustDesk dmg"; exit 1; }

          APP=$(find "$MOUNT" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::no .app found in the dmg"; hdiutil detach "$MOUNT" -quiet || true; exit 1; }

          sudo cp -R "$APP" /Applications/RustDesk.app
          hdiutil detach "$MOUNT" -quiet || true
          sudo xattr -cr /Applications/RustDesk.app

          echo "RustDesk installed"

      - name: Grant permissions (TCC)
        run: |
          SYS_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          USR_DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"

          grant() {  # $1=service  $2=client  $3=0 (bundle id) or 1 (path)
            for DB in "$SYS_DB" "$USR_DB"; do
              sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags,last_modified) VALUES ('$1','$2',$3,2,4,1,'UNUSED',0,strftime('%s','now'));" \
                || echo "::warning::TCC write failed: $1 / $2 / $DB"
            done
          }

          for SVC in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServicePostEvent kTCCServiceListenEvent; do
            grant "$SVC" com.carriez.RustDesk 0
            grant "$SVC" /Applications/RustDesk.app/Contents/MacOS/RustDesk 1
          done

          sudo killall tccd 2>/dev/null || true
          sleep 2

      - name: Configure and start RustDesk
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          RD=/Applications/RustDesk.app/Contents/MacOS/RustDesk

          RD_ID=""
          for _ in $(seq 1 10); do
            RD_ID=$("$RD" --get-id 2>/dev/null | tr -d '[:space:]')
            [ -n "$RD_ID" ] && break
            sleep 2
          done
          [ -n "$RD_ID" ] || { echo "::error::could not get a RustDesk ID"; exit 1; }

          nohup "$RD" --server > "$RUNNER_TEMP/rustdesk.log" 2>&1 &
          sleep 5

          "$RD" --password "$VNC_PASSWORD" || echo "::warning::could not set the permanent password"

          echo "RUSTDESK_ID: $RD_ID"
          {
            echo "### Connect with the RustDesk app"
            echo '```'
            echo "ID: $RD_ID"
            echo '```'
            echo "Password: your VNC_PASSWORD secret"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep alive
        run: |
          RD=/Applications/RustDesk.app/Contents/MacOS/RustDesk
          END=$(( $(date +%s) + SESSION_MINUTES * 60 ))
          NEXT_REPORT=$(( $(date +%s) + 1800 ))
          echo "Session: $SESSION_MINUTES min. Cancel the run to stop it early."

          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 30
            if ! pgrep -f "RustDesk --server" >/dev/null 2>&1; then
              echo "::warning::RustDesk server process not found, restarting..."
              nohup "$RD" --server > "$RUNNER_TEMP/rustdesk.log" 2>&1 &
              sleep 5
            fi
            NOW=$(date +%s)
            if [ "$NOW" -ge "$NEXT_REPORT" ]; then
              RD_ID=$("$RD" --get-id 2>/dev/null | tr -d '[:space:]')
              echo "RUSTDESK_ID: $RD_ID  (~$(( (END - NOW) / 60 )) min left)"
              NEXT_REPORT=$(( NOW + 1800 ))
            fi
          done

          echo "Session finished."
