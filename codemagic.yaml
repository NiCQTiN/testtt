workflows:
  mac-rdp:
    name: macOS Remote Session
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        - mac_secrets
      xcode: latest
      vars:
        SESSION_MINUTES: "115"

    scripts:
      - name: Check credentials
        script: |
          [ -n "$VNC_PASSWORD" ] || { echo "Missing VNC_PASSWORD"; exit 1; }
          [ -n "$TS_AUTHKEY" ] || { echo "Missing TS_AUTHKEY"; exit 1; }
          echo "Credentials OK"

      - name: Install Tailscale
        script: |
          brew install tailscale
          sudo brew services start tailscale

          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="codemagic-mac" \
            --ssh=false \
            --accept-dns=true

          echo "Tailscale IPv4:"
          tailscale ip -4

      - name: Keep Mac running
        script: |
          echo "Mac is ready"
          sw_vers
          system_profiler SPHardwareDataType

          sleep $((SESSION_MINUTES * 60))

          echo "Session finished"
